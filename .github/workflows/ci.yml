name: anchor-cg self-dogfood

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Run unit tests
        run: cargo test

      - name: Measure baseline (stub)
        run: cargo run --release -- measure --program counter --instruction increment

      - name: Calibrate initial baseline
        run: cargo run --release -- recalibrate --program counter --reason "CI initial baseline"

      - name: Compare (should pass)
        run: cargo run --release -- compare --program counter

      - name: Show calibration log
        run: cat CALIBRATION_LOG.md
